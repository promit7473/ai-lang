[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lang"
version = "0.2.0"
description = "A high-level programming language for guiding LLMs in robotics and agent tasks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
openrouter = ["openai>=1.0"]
groq = ["openai>=1.0"]
all = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
