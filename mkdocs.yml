site_name: AI Lang
site_url: https://ai-lang.ai
site_description: A high-level programming language for guiding LLMs in robotics and AI agent tasks
site_author: AI Lang Contributors

repo_url: https://github.com/ai-lang/ai-lang
repo_name: ai-lang/ai-lang

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - First Program: getting-started/first-program.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Robot Navigation: tutorials/robot-navigation.md
    - Multi-Agent Systems: tutorials/multi-agent.md
    - LLM Integration: tutorials/llm-integration.md
    - ROS2 Deployment: tutorials/ros2-deployment.md
  - Language Reference:
    - Syntax: language/syntax.md
    - Types: language/types.md
    - Blocks: language/blocks.md
    - Expressions: language/expressions.md
    - Skills: language/skills.md
  - API:
    - Interpreter: api/interpreter.md
    - Compiler: api/compiler.md
    - LLM Adapters: api/llm.md
    - Skills Registry: api/skills.md
  - Examples:
    - Overview: examples/index.md
    - Robot Navigation: examples/robot-navigation.md
    - LLM Orchestration: examples/llm-orchestration.md
    - Multi-Agent Pipeline: examples/multi-agent.md
  - Comparison: comparison.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-lang/ai-lang
  version:
    provider: mike

copyright: Copyright &copy; 2024-2026 AI Lang Contributors
